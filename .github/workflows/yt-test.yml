name: YouTube Shorts test

on:
  workflow_dispatch:
    inputs:
      run_id: { description: "public/<run_id> to upload (blank = newest)", default: "" }
      check_only: { description: "1 = only test the login, upload nothing", default: "0" }

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow && sudo apt-get install -y -q ffmpeg >/dev/null
      - name: Render the newest carousel as a Short and upload it
        run: python yt_test.py
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
